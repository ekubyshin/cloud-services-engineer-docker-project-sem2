name: Docker Project Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  BACKEND_IMAGE: momo-store-backend:ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FRONTEND_IMAGE: momo-store-frontend:ci

jobs:
  build_scan_and_push_to_docker_hub:
    name: Build, scan and push Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/
          load: true
          tags: ${{ env.BACKEND_IMAGE }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend/
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Login to Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend image to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "${BACKEND_IMAGE}" "${{ secrets.DOCKER_USER }}/docker-project-backend:latest"
          docker push "${{ secrets.DOCKER_USER }}/docker-project-backend:latest"

      - name: Push frontend image to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "${FRONTEND_IMAGE}" "${{ secrets.DOCKER_USER }}/docker-project-frontend:latest"
          docker push "${{ secrets.DOCKER_USER }}/docker-project-frontend:latest"

  run-with-docker-compose:
    name: Build via Docker Compose with cache
    runs-on: ubuntu-latest
    needs: build_scan_and_push_to_docker_hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build via Docker Compose
        run: docker compose -f docker-compose.yml -f .github/docker-compose.cache.yml build