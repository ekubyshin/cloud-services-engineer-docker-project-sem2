name: momo-store

services:
  backend:
    build:
      context: ./backend
    image: momo-store-backend:${APP_VERSION:-1.0.0}
    environment:
      TZ: ${TZ:-UTC}
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_FILE: /run/secrets/backend_api_token
    expose:
      - "8081"
    secrets:
      - source: backend_api_token
        target: backend_api_token
    networks:
      - momo-net
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL:-/api}
    image: momo-store-frontend:${APP_VERSION:-1.0.0}
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - frontend-html:/mnt
    networks:
      - momo-net
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - momo-net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,size=32m,uid=101,gid=101,mode=0770
      - /tmp:rw,size=16m,uid=101,gid=101,mode=1777
      - /var/run:size=8m,uid=101,gid=101,mode=0770
    volumes:
      - frontend-html:/usr/share/nginx/html:ro
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/momo-store/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  momo-net:
    driver: bridge

volumes:
  frontend-html:
  nginx-logs:

secrets:
  backend_api_token:
    file: ${BACKEND_SECRET_FILE:-./secrets/backend_api_token.example}
