name: momo-store

x-security-defaults: &security-defaults
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 100
  restart: unless-stopped

services:
  backend:
    <<: *security-defaults
    image: momo-store-backend:${APP_VERSION:-1.0.0}
    build:
      context: ./backend
    expose:
      - "8081"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_FILE: /run/secrets/backend_api_token
    secrets:
      - source: backend_api_token
        target: backend_api_token
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: "0.50"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    <<: *security-defaults
    image: momo-store-frontend:${APP_VERSION:-1.0.0}
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - public
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/run:size=8m,mode=1777
    volumes:
      - type: volume
        source: frontend-nginx-cache
        target: /var/cache/nginx
    cpus: "0.50"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/momo-store/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  backend-dev:
    image: golang:1.25-alpine
    profiles:
      - dev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    user: nobody
    working_dir: /src
    command: sh -c "go run ./cmd/api"
    restart: unless-stopped
    environment:
      APP_ENV: development
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go/pkg/mod
      HOME: /tmp
    volumes:
      - ./backend:/src:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,exec
    ports:
      - "${BACKEND_DEV_PORT:-8081}:8081"
    networks:
      - backend
      - public
    cpus: "0.75"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

  frontend-dev:
    image: node:20-alpine
    profiles:
      - dev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    user: node
    working_dir: /app
    command: sh -c "cp -R /app /tmp/app && cd /tmp/app && npm ci && npm run serve -- --host 0.0.0.0 --port 8080"
    restart: unless-stopped
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
      VUE_APP_API_URL: ${DEV_API_URL:-http://localhost:8081}
    volumes:
      - ./frontend:/app:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,exec
    ports:
      - "${FRONTEND_DEV_PORT:-3000}:8080"
    networks:
      - public
    depends_on:
      backend-dev:
        condition: service_healthy
    cpus: "0.75"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  public:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  frontend-nginx-cache:

secrets:
  backend_api_token:
    file: ${BACKEND_SECRET_FILE:-./secrets/backend_api_token.example}
